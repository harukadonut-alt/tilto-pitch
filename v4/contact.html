<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="robots" content="noindex,nofollow"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ご相談｜Tilto°</title>
<meta name="description" content="採用サイトのご相談。月額27,000円・初期費用0円。ご提案は最短1週間です。"/>
<link rel="shortcut icon" href="./favicon.svg"/>
<link rel="icon" href="./favicon.svg"/>
<style>
/* ============================================================
   ご相談ページ（2026-08-31・仮）

   🔴 まだ送信先が決まっていない。
      GitHub Pages は静的なので、フォームを実際に飛ばすには
        A. 外部サービス（Formspree 等）に POST する
        B. Savor Flow 側のサーバーに POST する
      のどちらかが要る。**送信先のメールアドレスも未確定**。

      決まったらこの2か所だけ直せば動く:
        1. <form> の action= に送信先を入れる
        2. 送信ボタンの disabled と .cf-pending を外す

      ⚠️ それまでは**送信できるように見せない**。押せるのに何も起きない
         問い合わせフォームは、届いたと思わせてしまうので最も悪い。
   ============================================================ */
* { box-sizing: border-box }

body {
    color: #111;
    background: #f7f4ee;
    -webkit-font-smoothing: antialiased;
    margin: 0;
    font-family: Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif;
    font-feature-settings: "palt";
    letter-spacing: .025em
}

a { color: inherit }

/* --- ヘッダー --- */
.cf-head {
    justify-content: space-between;
    align-items: center;
    width: min(1240px, 92vw);
    margin-inline: auto;
    padding: clamp(20px, 2.2vw, 34px) 0;
    display: flex
}

.cf-brand {
    letter-spacing: -.045em;
    font-family: Didot, "Bodoni 72", Times New Roman, serif;
    font-size: clamp(26px, 2.3vw, 34px);
    font-weight: 500;
    line-height: 1;
    text-decoration: none
}

.cf-brand sup {
    vertical-align: top;
    margin-left: .06em;
    font-size: .65em
}

.cf-back {
    letter-spacing: .1em;
    font: 700 clamp(9px, .8vw, 12px)/1 Arial, sans-serif;
    text-decoration: none
}

.cf-back:hover { color: #ff4d4f }

/* --- 本体：左に言葉、右にフォーム --- */
.cf-main {
    grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
    column-gap: clamp(40px, 6vw, 96px);
    width: min(1240px, 92vw);
    margin-inline: auto;
    padding: clamp(28px, 3.4vw, 56px) 0 clamp(56px, 6vw, 96px);
    display: grid
}

.cf-label {
    color: #111;
    letter-spacing: .2em;
    border-bottom: 1px solid #111;
    margin: 0 0 clamp(26px, 3vw, 46px);
    padding-bottom: clamp(12px, 1.15vw, 19px);
    font: 500 clamp(11px, 1.02vw, 16px)/1 Arial, sans-serif
}

.cf-title {
    letter-spacing: -.03em;
    margin: 0;
    font-family: Yu Mincho, Hiragino Mincho ProN, Noto Serif JP, serif;
    font-size: clamp(38px, 4.6vw, 72px);
    font-weight: 500;
    line-height: 1.34
}

.cf-lead {
    color: #111111d1;
    margin: clamp(20px, 2.2vw, 34px) 0 0;
    font-family: Yu Mincho, Hiragino Mincho ProN, Noto Serif JP, serif;
    font-size: clamp(13px, 1.05vw, 16px);
    font-weight: 500;
    line-height: 2
}

/* 料金の要点。ここに書いてよいのは決まっている事実だけ */
.cf-facts {
    margin: clamp(34px, 4vw, 60px) 0 0;
    padding: 0;
    list-style: none
}

.cf-facts li {
    border-bottom: 1px solid #11111f1f;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: clamp(12px, 1.3vw, 20px) 0;
    display: flex
}

.cf-facts dt, .cf-facts b {
    letter-spacing: .1em;
    font: 700 clamp(9px, .8vw, 12px)/1.4 Arial, sans-serif
}

.cf-facts span {
    font-family: Yu Mincho, Hiragino Mincho ProN, Noto Serif JP, serif;
    font-size: clamp(15px, 1.4vw, 22px);
    font-weight: 500
}

.cf-facts em {
    font-size: .62em;
    font-style: normal
}

/* --- フォーム --- */
.cf-form { margin: 0 }

.cf-field {
    margin-bottom: clamp(20px, 2.2vw, 34px)
}

.cf-field > label {
    align-items: baseline;
    gap: 10px;
    margin-bottom: 9px;
    display: flex
}

.cf-field > label > b {
    letter-spacing: .06em;
    font: 700 clamp(10px, .85vw, 13px)/1 Arial, sans-serif
}

.cf-req {
    color: #ff4d4f;
    letter-spacing: .1em;
    font: 700 8.5px/1 Arial, sans-serif
}

.cf-any {
    color: #11111f70;
    letter-spacing: .1em;
    font: 700 8.5px/1 Arial, sans-serif
}

.cf-field input,
.cf-field select,
.cf-field textarea {
    color: #111;
    -webkit-appearance: none;
    appearance: none;
    background: #fffdf9;
    border: 1px solid #11111f2b;
    border-radius: 0;
    width: 100%;
    padding: clamp(11px, 1.1vw, 16px) clamp(12px, 1.2vw, 18px);
    font-family: inherit;
    font-size: clamp(13px, 1.02vw, 16px);
    line-height: 1.6;
    transition: border-color .2s
}

.cf-field textarea {
    min-height: clamp(120px, 13vw, 190px);
    resize: vertical
}

.cf-field select {
    background-image: linear-gradient(45deg, #0000 50%, #111 50%), linear-gradient(135deg, #111 50%, #0000 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
    background-repeat: no-repeat;
    background-size: 6px 6px, 6px 6px;
    padding-right: 42px
}

.cf-field input:focus,
.cf-field select:focus,
.cf-field textarea:focus {
    border-color: #ff4d4f;
    outline: none
}

/* --- 送信 --- */
.cf-send {
    color: #f7f4ee;
    cursor: pointer;
    background: #111;
    border: 0;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    width: 100%;
    min-height: clamp(64px, 6vw, 88px);
    padding: 0 clamp(20px, 2.2vw, 34px);
    font-family: Yu Mincho, Hiragino Mincho ProN, Noto Serif JP, serif;
    font-size: clamp(15px, 1.3vw, 20px);
    font-weight: 500;
    transition: background-color .25s, color .25s;
    display: flex
}

.cf-send b {
    font: 300 clamp(24px, 2.4vw, 36px)/1 Arial, sans-serif
}

.cf-send:hover:not(:disabled) {
    color: #111;
    background: #f7f4ee;
    box-shadow: inset 0 0 0 1px #111
}

.cf-send:disabled {
    cursor: not-allowed;
    background: #11111f3d
}

/* 🔴 送信先が決まるまで出す注記。決まったら消す */
.cf-pending {
    color: #11111fa8;
    align-items: flex-start;
    gap: 8px;
    margin: 12px 0 0;
    font-size: clamp(11px, .9vw, 13px);
    line-height: 1.75;
    display: flex
}

.cf-pending i {
    color: #ff4d4f;
    flex-shrink: 0;
    font-style: normal
}

/* 送信の結果。派手にしない */
.cf-result {
    margin: 14px 0 0;
    font-size: clamp(12px, .95vw, 14px);
    line-height: 1.8
}

.cf-result.is-ok { color: #111 }
.cf-result.is-ng { color: #ff4d4f }

/* --- フッター --- */
.cf-foot {
    border-top: 1px solid #11111f1f;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    width: min(1240px, 92vw);
    margin-inline: auto;
    padding: clamp(20px, 2.2vw, 32px) 0 clamp(28px, 3vw, 44px);
    display: flex
}

.cf-foot small {
    color: #11111fa8;
    font-size: clamp(9.5px, .8vw, 12px);
    line-height: 1.7
}

.cf-foot a { border-bottom: 1px solid #11111f3d; text-decoration: none }

@media (max-width: 820px) {
    .cf-main {
        grid-template-columns: 1fr;
        row-gap: 44px;
        padding: 24px 0 48px
    }

    .cf-title { font-size: clamp(30px, 8.4vw, 44px) }

    .cf-foot {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px
    }
}
</style>
</head>
<body>

<header class="cf-head">
    <a class="cf-brand" href="./index.html">Tilto<sup>°</sup></a>
    <a class="cf-back" href="./index.html">← サイトへ戻る</a>
</header>

<main class="cf-main">
    <div>
        <p class="cf-label">CONTACT</p>
        <h1 class="cf-title">まずは、<br/>話してみる。</h1>
        <p class="cf-lead">
            まだ「なんとなく」で大丈夫です。<br/>
            言葉になる前の段階からご一緒します。<br/>
            原稿や写真が手元になくても始められます。
        </p>

        <ul class="cf-facts">
            <li><b>MONTHLY</b><span>27,000<em> 円 / 月</em></span></li>
            <li><b>INITIAL COST</b><span>0<em> 円</em></span></li>
            <li><b>PROPOSAL</b><span>最短 1<em> 週間</em></span></li>
        </ul>
    </div>

    <div>
        <!-- 🔴 やることは**1行だけ**。下の access_key の value に、
             web3forms.com で受け取ったアクセスキーを貼る。それだけで
             ボタンが有効になり、届いた内容が指定のメールへ転送される。
             （キーを貼るまではボタンは押せないまま＝届かない送信は起きない）

             ⚠️ **メールアドレスをこのHTMLに書かないこと。**
                このサイトの配信リポジトリは public なので、書くと
                アドレスが公開され、git履歴からも消せなくなる。
                web3forms は「キー」だけを置く仕組みなのでそれを使う。 -->
        <form class="cf-form" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="PASTE_ACCESS_KEY_HERE"/>
            <input type="hidden" name="subject" value="Tilto° サイトからのご相談"/>
            <input type="hidden" name="from_name" value="Tilto° お問い合わせフォーム"/>
            <!-- 迷惑メール除け。人には見えない。埋まっていたら弾かれる -->
            <input type="checkbox" name="botcheck" tabindex="-1" aria-hidden="true" style="display:none"/>
            <div class="cf-field">
                <label for="cf-company"><b>会社名</b><span class="cf-req">REQUIRED</span></label>
                <input id="cf-company" name="company" type="text" autocomplete="organization" required/>
            </div>

            <div class="cf-field">
                <label for="cf-name"><b>お名前</b><span class="cf-req">REQUIRED</span></label>
                <input id="cf-name" name="name" type="text" autocomplete="name" required/>
            </div>

            <div class="cf-field">
                <label for="cf-mail"><b>メールアドレス</b><span class="cf-req">REQUIRED</span></label>
                <input id="cf-mail" name="email" type="email" autocomplete="email" required/>
            </div>

            <div class="cf-field">
                <label for="cf-tel"><b>電話番号</b><span class="cf-any">OPTIONAL</span></label>
                <input id="cf-tel" name="tel" type="tel" autocomplete="tel"/>
            </div>

            <div class="cf-field">
                <label for="cf-kind"><b>ご相談の種類</b><span class="cf-any">OPTIONAL</span></label>
                <select id="cf-kind" name="kind">
                    <option value="">選んでください</option>
                    <option>新しく採用サイトをつくりたい</option>
                    <option>いまの採用サイトをつくり直したい</option>
                    <option>採用のことから相談したい</option>
                    <option>まだ決まっていない</option>
                </select>
            </div>

            <div class="cf-field">
                <label for="cf-body"><b>ご相談の内容</b><span class="cf-any">OPTIONAL</span></label>
                <textarea id="cf-body" name="message" placeholder="いま困っていること、採用で伝えたいこと、決まっていないことなど。箇条書きでかまいません。"></textarea>
            </div>

            <button class="cf-send" type="submit" disabled>送信する<b aria-hidden="true">→</b></button>

            <p class="cf-pending"><i>※</i><span>このページは仮です。送信先の設定が済みしだい、このボタンが有効になります。</span></p>
            <p class="cf-result" role="status" hidden></p>
        </form>
    </div>
</main>

<footer class="cf-foot">
    <small><a href="https://savorflow.co.jp/" target="_blank" rel="noopener">株式会社Savor Flow</a></small>
    <small><a href="https://savorflow.co.jp/privacy" target="_blank" rel="noopener">プライバシーポリシー</a></small>
    <small>© 2026 TILTO° All Rights Reserved.</small>
</footer>

<script>
/* 送信の制御。
   ・アクセスキーが未設定のあいだはボタンを押せないままにする（届かない送信を起こさない）
   ・キーが入っていればボタンを有効にし、fetchで送ってこのページのまま結果を出す
     （素のPOSTだと web3forms の画面へ飛ばされてサイトの世界観から外れる）
   ・JSが動かない環境では素のPOSTにそのまま任せる（届きはする） */
(function () {
    var form = document.querySelector('.cf-form');
    if (!form) return;
    var key = form.querySelector('[name="access_key"]');
    var btn = form.querySelector('.cf-send');
    var pending = form.querySelector('.cf-pending');
    var result = form.querySelector('.cf-result');
    var ready = key && key.value && key.value !== 'PASTE_ACCESS_KEY_HERE';

    if (!ready) return;              /* 仮のまま。disabled と注記を残す */

    btn.disabled = false;
    if (pending) pending.remove();

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        btn.disabled = true;
        var label = btn.firstChild;
        var was = label.nodeValue;
        label.nodeValue = '送信中';
        result.hidden = true;

        fetch(form.action, {
            method: 'POST',
            headers: { Accept: 'application/json' },
            body: new FormData(form)
        }).then(function (r) { return r.json(); })
          .then(function (d) {
              if (d && d.success) {
                  form.reset();
                  result.textContent = 'ありがとうございます。内容を受け取りました。追ってご連絡します。';
                  result.className = 'cf-result is-ok';
              } else {
                  throw new Error('ng');
              }
          })
          .catch(function () {
              result.textContent = 'うまく送信できませんでした。お手数ですが、時間をおいてもう一度お試しください。';
              result.className = 'cf-result is-ng';
          })
          .then(function () {
              result.hidden = false;
              label.nodeValue = was;
              btn.disabled = false;
          });
    });
})();
</script>
</body>
</html>
