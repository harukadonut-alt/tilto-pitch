<!DOCTYPE html>

<!-- ファビコン。2026-09-09、社長が用意した4案から**C案**（丸が右上・Tの先だけが触れる）に
     一本化した。**一旦C**で、最終はかずさんと定例で決める（TODOの判断待ちの行）。
     比べものと各サイズの書き出しは docs/favicon-2026-09-09/ に置いてある。
     ⚠️ 中身を差し替えたらファイル名は同じでも `?v=` を上げること。上げないと
        ブラウザが古いアイコンを出しつづける（favicon はとくにしつこく残る）。 -->
<link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png?v=3"/><link rel="apple-touch-icon" href="./apple-touch-icon.png?v=3"/>
<style>
/* ============================================================
   ご相談ページ

   🔴 まだ送信先が決まっていない。
      GitHub Pages は静的なので、フォームを実際に飛ばすには
      web3forms のアクセスキーが要る。**送信先のメールアドレスも未確定**。
      決まったら access_key の value を差し替えるだけで動く（下の注記を読む）。
      ⚠️ それまでは**送信できるように見せない**。押せるのに何も起きない
         問い合わせフォームは、届いたと思わせてしまうので最も悪い。

   ── 組み方（2026-09-08 に左右2枚組へ組み替え）─────────────
   左＝写真を敷いて **スクロールしても動かない**（position: sticky）。
        載せるのは「まずは、話してみる。」と、月額・初期費用・期間の3つだけ。
   右＝記入欄。テキストはすべてこちら側（プライバシーポリシー、Savor Flow、著作権表示）。
   🔴 写真の左下に植物の暗部（明度8）があり、黒い字がそのままでは沈む。
      左ほど濃い覆いを重ねて、字が乗る左7割だけを持ち上げている（--veil）。
      縦位置・覆い・白い板の3つは実測で決めた（design/principles.md 基準18）。
        ・縦位置 12% … 見出しが白壁に乗り（暗部196）、上にランプ、下に机が両方入る位置
        ・覆い .42→.14 … モックのように写真をくっきり出す。見出しはこれでコントラスト6.7
        ・白い板 … リードと3つの事実の裏は植物の暗部（65）で、覆いでは足りない。
          板の中はコントラスト12.7。**覆いを濃くする代わりに板で解く**のが要点で、
          覆いを濃くすると写真ぜんぶが白ちゃけてモックから離れる。
          🔴 板は内側の余白ぶん**左へ引き出してある**。そうしないと板の中の字だけが
             右へずれて、見出しと左端が揃わなくなる（基準15の①で必ず出る）
      ⚠️ ズームで柄を避ける案も測ったが、机・マグ・ランプが画面から消えて構図が死んだので採らない。
      写真を差し替えたら、この3つを測り直すこと。
   ============================================================ */
* { box-sizing: border-box }

:root {
    --ink: #111;
    --coral: #ff4d4f;
    --paper: #faf9f7;
    --line: #1111111f;
    --pad: clamp(26px, 3.6vw, 60px);
    /* 記入欄の面の左右余白。写真面の --pad より広い */
    --cf-pad-x: clamp(32px, 6.4vw, 110px);
    /* 2列に組むときの列間。お名前の幅を出すのにも使う */
    --cf-gap: clamp(16px, 1.7vw, 26px);
}

html { -webkit-text-size-adjust: 100% }

body {
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    margin: 0;
    font-family: Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif;
    font-feature-settings: "palt";
    letter-spacing: .025em
}

a { color: inherit }

/* --- 2枚組。左は動かず、右だけ流れる --- */
.cf-shell {
    grid-template-columns: minmax(0, 44fr) minmax(0, 56fr);
    align-items: start;
    min-height: 100vh;
    display: grid
}

/* --- 左：写真と、3つの事実 --- */
.cf-visual {
    background: #e8e6e2 url("./images/contact-desk.webp") 50% 12% / cover no-repeat;
    flex-direction: column;
    justify-content: center;
    height: 100vh;
    padding: var(--pad);
    display: flex;
    position: sticky;
    top: 0;
    overflow: hidden
}

/* 字が乗る左側だけを持ち上げる覆い。右へ抜けるほど写真が素で出る */
.cf-visual:before {
    background: linear-gradient(100deg,
        #faf9f76b 0%, #faf9f74d 40%, #faf9f738 76%, #faf9f723 100%);
    position: absolute;
    inset: 0;
    content: ""
}

.cf-visual > * { position: relative }

.cf-brand {
    align-items: flex-start;
    gap: 14px;
    text-decoration: none;
    display: flex;
    position: absolute;
    top: var(--pad);
    left: var(--pad)
}

.cf-brand i {
    letter-spacing: -.045em;
    font-family: Didot, "Bodoni 72", Times New Roman, serif;
    font-size: clamp(28px, 2.5vw, 38px);
    font-style: normal;
    font-weight: 500;
    line-height: .9
}

.cf-brand i sup {
    vertical-align: top;
    margin-left: .06em;
    font-size: .62em
}

.cf-brand small {
    letter-spacing: .17em;
    padding-top: .35em;
    font: 700 clamp(7.5px, .62vw, 9.5px)/1.72 Arial, sans-serif
}

.cf-say { width: min(100%, 470px) }

/* 🔴 トップページのFVの見出しと**同じ寸法・同じ太さ**に揃えてある。
   問い合わせページの見出しがトップより目立つのはおかしい、という判断（2026-09-08 社長）。
   数値は index の .hero-copy h1 を実測して写した:
     font-size calc(5.18 * min(1vw, 1.77519svh)) / weight 600 / letter-spacing -.085em
   ⚠️ 行間は CSS に 1.15 と書いてあるが、実際に効いているのは 1.24（別の規則が上書きしている）。
      **書いてある値ではなく実測値**に合わせること。
   ⚠️ トップ側を変えたらここも変える。片方だけ動かすと、また大小が食い違う。 */
.cf-title {
    letter-spacing: -.085em;
    margin: 0;
    font-family: Yu Mincho, Hiragino Mincho ProN, Noto Serif JP, serif;
    font-size: calc(5.18 * min(1vw, 1.77519svh));
    font-weight: 600;
    line-height: 1.24
}

.cf-title span { color: var(--coral) }

.cf-lead {
    color: #111111d6;
    margin: 0;
    font-size: clamp(12.5px, 1.02vw, 15px);
    line-height: 2.06
}

/* 半透明の白い板。写真の上で字が沈むのを、覆いを濃くする代わりにこれで解く。
   🔴 覆いを濃くすると写真ぜんぶが白ちゃけるが、板なら**字のある所だけ**を持ち上げられる。
      板の内側で、いちばん暗い「初期費用 0円」の裏でもコントラスト12.7。 */
.cf-plate {
    --pp: clamp(18px, 1.9vw, 28px);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    background: #ffffffb8;
    width: min(100%, calc(430px + var(--pp) * 2));
    /* 🔴 板の左端＝見出しの左端（左へ引き出さない）。そのうえで**内側に余白を持たせる**。
       2026-09-08 に社長から2回指摘があり、両方を満たす形がこれ:
         1回目「板の左端が見出しの左端と合っていない」→ 左へ引き出すのをやめた
         2回目「テキストの左に余白がない」→ 左の内側余白を戻した
       結果、板の中の字は板のふちから var(--pp) だけ内側に入る。
       ⚠️ そのぶん、リードと料金の字は見出しより内側にずれる。これは意図した段差で、
          左右チェック（基準15の①）が⚠️を出すが、直さないこと。 */
    margin: clamp(22px, 2.4vw, 36px) 0 0;
    padding: var(--pp) var(--pp) calc(var(--pp) * .55)
}

/* 書いてよいのは決まっている事実だけ */
.cf-facts {
    margin: clamp(18px, 2vw, 30px) 0 0;
    padding: 0;
    list-style: none
}

.cf-facts li {
    border-bottom: 1px solid #1111112e;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: clamp(11px, 1.25vw, 19px) 0;
    display: flex
}

.cf-facts b {
    letter-spacing: .13em;
    font: 700 clamp(8.5px, .78vw, 11px)/1.4 Arial, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif
}

.cf-facts span {
    font-family: Yu Mincho, Hiragino Mincho ProN, Noto Serif JP, serif;
    font-size: clamp(16px, 1.5vw, 23px);
    font-weight: 500;
    line-height: 1
}

.cf-facts li:last-child { border-bottom: 0 }

.cf-facts em {
    font-size: .6em;
    font-style: normal
}

/* --- 右：記入欄と、文字ぜんぶ --- */
.cf-panel {
    background: var(--paper);
    flex-direction: column;
    min-height: 100vh;
    /* 🔴 左右の余白は、左の写真面（--pad）より広く取る。
       右端の縦組みを消したあと --pad まで詰めたら「余白が少ない」と言われたので、
       左右そろえて広げ、そのぶん記入欄を狭くした（2026-09-09 社長）。
       ⚠️ 左右は必ず同じ値にする。片方だけ広げると記入欄が中心から外れる */
    padding: var(--pad) var(--cf-pad-x) 0;
    display: flex;
    position: relative
}

.cf-back {
    letter-spacing: .12em;
    align-self: flex-end;
    margin-bottom: clamp(28px, 3.4vw, 56px);
    font: 700 clamp(9.5px, .82vw, 12px)/1 Arial, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif;
    text-decoration: none;
    transition: color .2s
}

.cf-back:hover { color: var(--coral) }

.cf-form { width: min(100%, 760px); margin: 0 }

/* 記入欄のかたまり。PC（左右2枚組みになる幅）では短い項目を2列にする。
   1列に7段積むと、左の板（画面に貼り付いて動かない）に対して右だけが
   長いトンネルになり、目が下に落ちるだけの面になっていた。
   2列にすると 会社名/お名前・メール/電話・役職/種類 が意味の対で並び、
   段が4つに減る。ご相談の内容だけ全幅（.cf-wide）。
   ⚠️ 隙間は margin ではなく gap で持つ。列をまたいでも段の高さが揃う。 */
.cf-fields {
    row-gap: clamp(18px, 2vw, 30px);
    display: grid
}

@media (min-width: 901px) {
    .cf-fields {
        grid-template-columns: 1fr 1fr;
        column-gap: var(--cf-gap)
    }

    .cf-fields > .cf-wide { grid-column: 1 / -1 }

    /* 🔴 お名前は「左上に、下のメールアドレスと同じ幅で、その行に1つだけ」。
       段だけ全幅にして次の項目を次の行へ送り、**見た目の幅は半分**にする。
       ⚠️ `grid-column: 1` だけにすると、メールアドレスが同じ行の右へ回ってしまう */
    .cf-fields > .cf-half {
        grid-column: 1 / -1;
        width: calc(50% - var(--cf-gap) / 2)
    }
}

.cf-field { margin-bottom: 0 }

.cf-field > label {
    align-items: baseline;
    gap: 10px;
    margin-bottom: 9px;
    display: flex
}

/* 🔴 Arial だけだと日本語の字が拾えず、Windowsでは MS ゴシック等に落ちる。
   本文と同じ和文の指定を後ろに足して、どのOSでも同じ書体で出す（2026-09-09） */
.cf-field > label > b {
    letter-spacing: .06em;
    font: 700 clamp(11px, .88vw, 13.5px)/1 Arial, Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif
}

.cf-req {
    color: var(--coral);
    letter-spacing: .1em;
    font: 700 8.5px/1 Arial, sans-serif
}

.cf-any {
    color: #11111170;
    letter-spacing: .1em;
    font: 700 8.5px/1 Arial, sans-serif
}

.cf-field input,
.cf-field select,
.cf-field textarea {
    color: var(--ink);
    -webkit-appearance: none;
    appearance: none;
    background: #fff;
    /* 🔴 ふちの濃さ。#111 の20%（コントラスト1.56）では枠が見えず、
       どこが記入欄か分からなかった。50%にして白地に対して3.54、
       紙色に対して3.37 ＝ 操作部品の輪郭に要る3.0を満たす（2026-09-09 実測） */
    border: 1px solid #11111180;
    border-radius: 0;
    width: 100%;
    padding: clamp(11px, 1.1vw, 16px) clamp(12px, 1.2vw, 18px);
    font-family: inherit;
    font-size: clamp(13px, 1.02vw, 16px);
    line-height: 1.6;
    transition: border-color .2s
}

.cf-field textarea {
    min-height: clamp(112px, 11vw, 168px);
    resize: vertical
}

.cf-field select {
    background-image: linear-gradient(45deg, #0000 50%, #111 50%), linear-gradient(135deg, #111 50%, #0000 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
    background-repeat: no-repeat;
    background-size: 6px 6px, 6px 6px;
    padding-right: 42px
}

.cf-field input:focus,
.cf-field select:focus,
.cf-field textarea:focus {
    border-color: var(--coral);
    outline: none
}

/* --- 送信 --- */
.cf-send {
    color: #fff;
    cursor: pointer;
    background: var(--coral);
    border: 0;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    width: 100%;
    min-height: clamp(60px, 5.4vw, 80px);
    margin-top: clamp(24px, 2.6vw, 38px);
    padding: 0 clamp(20px, 2.2vw, 34px);
    font-family: Yu Mincho, Hiragino Mincho ProN, Noto Serif JP, serif;
    font-size: clamp(15px, 1.3vw, 20px);
    font-weight: 500;
    transition: background-color .25s, color .25s;
    display: flex
}

.cf-send b { font: 300 clamp(22px, 2.2vw, 32px)/1 Arial, sans-serif }

.cf-send:hover:not(:disabled) {
    color: var(--ink);
    background: #0000;
    box-shadow: inset 0 0 0 1px var(--ink)
}

.cf-send:disabled {
    color: #ffffffdb;
    cursor: not-allowed;
    background: #11111147
}

/* 🔴 送信先が決まるまで出す注記。決まったら消す */
.cf-pending {
    color: #111111a8;
    align-items: flex-start;
    gap: 8px;
    margin: 12px 0 0;
    font-size: clamp(11px, .9vw, 13px);
    line-height: 1.75;
    display: flex
}

.cf-pending b { font-weight: 700 }

.cf-pending i {
    color: var(--coral);
    flex-shrink: 0;
    font-style: normal
}

/* 送信の結果。派手にしない */
.cf-result {
    margin: 14px 0 0;
    font-size: clamp(12px, .95vw, 14px);
    line-height: 1.8
}

.cf-result.is-ok { color: var(--ink) }
.cf-result.is-ng { color: var(--coral) }

/* --- 右のいちばん下。文字はぜんぶこちら側 --- */
.cf-foot {
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px 26px;
    width: min(100%, 760px);
    margin-top: clamp(44px, 5vw, 76px);
    padding: clamp(18px, 1.9vw, 26px) 0 var(--pad);
    display: flex
}

.cf-foot small {
    color: #111111a8;
    font-size: clamp(9.5px, .8vw, 11.5px);
    line-height: 1.7
}

.cf-foot nav { gap: 22px; display: flex }

.cf-foot a {
    border-bottom: 1px solid #1111113d;
    text-decoration: none;
    transition: color .2s, border-color .2s
}

.cf-foot a:hover { color: var(--coral); border-color: var(--coral) }

/* --- 縦に積む幅 --- */
@media (max-width: 900px) {
    .cf-shell { grid-template-columns: 1fr }

    .cf-visual {
        height: auto;
        min-height: 84vh;
        padding: calc(var(--pad) + 62px) var(--pad) calc(var(--pad) + 8px);
        position: static
    }

    .cf-visual:before {
        background: linear-gradient(168deg, #faf9f7c7 0%, #faf9f7a3 52%, #faf9f770 100%)
    }

    .cf-say { width: 100% }

    .cf-title { font-size: clamp(30px, 6.4vw, 52px) }

    .cf-panel {
        min-height: 0;
        padding: var(--pad) var(--pad) 0
    }

    .cf-back {
        margin-bottom: clamp(22px, 4vw, 34px)
    }

    .cf-form, .cf-foot { width: 100% }

    /* 1列に積む幅では、お名前も他と同じ全幅にする */
    .cf-fields > .cf-half { width: auto }
}

/* トップページのSP（@media max-width:700px の #top h1）と同じ寸法にする。
   ただし中央寄せの送り（padding-left: 5.6vw）は、こちらが左揃えなので入れない */
@media (max-width: 700px) {
    .cf-title { letter-spacing: -1.15px; font-size: 11.6vw; line-height: 1.4 }
}

@media (max-width: 480px) {
    .cf-foot { flex-direction: column; align-items: flex-start }
    .cf-foot nav { gap: 18px }
}

/* ── 送信ボタンまでスクロールせずに届く高さ（2026-09-11 定例・かずさん）──────────
   前（実測）: 送信ボタンの下端 1440×900で844px／1536×864で880px（はみ出す）。
   ブラウザの上のバーを引くと、1440×900のノートPCで見える高さは約790px しかない。
   → 縦の量を「画面の高さ（vh）」で縮むようにする。PCの幅だけに効かせる（SPは縦に流す前提のまま）。
   ⚠️ 入力欄の文字の大きさは変えない（読みにくくなる）。削るのは余白と欄の高さだけ */
@media (min-width: 901px) {
    .cf-back { margin-bottom: clamp(14px, 3.2vh, 48px) }
    .cf-fields { row-gap: clamp(12px, 2.2vh, 28px) }
    .cf-field > label { margin-bottom: clamp(5px, .9vh, 9px) }
    .cf-field input,
    .cf-field select,
    .cf-field textarea { padding-block: clamp(7px, 1.25vh, 15px) }
    .cf-field textarea { min-height: clamp(76px, 12vh, 160px) }
    .cf-send {
        min-height: clamp(50px, 7vh, 76px);
        margin-top: clamp(14px, 2.6vh, 36px)
    }
}
</style>
</head>
<body>

<div class="cf-shell">

    <!-- 左：スクロールしても動かない。載せるのは見出しと3つの事実だけ -->
    <aside class="cf-visual">
        <a class="cf-brand" href="./index.html">
            <i>Tilto<sup>°</sup></i>
            <small>RECRUITMENT<br/>CREATIVE<br/>STUDIO</small>
        </a>

        <div class="cf-say">
            <h1 class="cf-title">まずは、<br/><span>話してみる。</span></h1>
            <div class="cf-plate">
                <p class="cf-lead">
                    まだ「なんとなく」で大丈夫です。<br/>
                    言葉になる前の段階からご一緒します。<br/>
                    原稿や写真が手元になくても始められます。
                </p>

                <ul class="cf-facts">
                    <li><b>MONTHLY</b><span>27,000<em> 円 / 月</em></span></li>
                    <li><b>PROPOSAL</b><span>最短 1<em> 週間</em></span></li>
                </ul>
            </div>
        </div>
    </aside>

    <!-- 右：記入欄と、文字ぜんぶ -->
    <main class="cf-panel">
        <a class="cf-back" href="./index.html">← サイトへ戻る</a>

        <!-- 🔴 やることは**1行だけ**。下の access_key の value に、
             web3forms.com で受け取ったアクセスキーを貼る。それだけで
             ボタンが有効になり、届いた内容が指定のメールへ転送される。
             （キーを貼るまではボタンは押せないまま＝届かない送信は起きない）

             ⚠️ **メールアドレスをこのHTMLに書かないこと。**
                このサイトの配信リポジトリは public なので、書くと
                アドレスが公開され、git履歴からも消せなくなる。
                web3forms は「キー」だけを置く仕組みなのでそれを使う。 -->
        <form class="cf-form" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="PASTE_ACCESS_KEY_HERE"/>
            <input type="hidden" name="subject" value="Tilto° サイトからのご相談"/>
            <!-- JSが動かない環境の行き先。web3forms が素のPOSTのあとここへ返す。
                 🔴 絶対URLしか受け付けないので、いまの公開先を直に書いてある。
                    独自ドメインに移したら**ここも直す**。JSが動く環境では、
                    下のスクリプトがこの値を今いる場所基準で上書きするので影響しない。 -->
            <input type="hidden" name="redirect" value="https://harukadonut-alt.github.io/tilto-pitch/v4/thanks.html"/>
            <input type="hidden" name="from_name" value="Tilto° お問い合わせフォーム"/>
            <!-- 迷惑メール除け。人には見えない。埋まっていたら弾かれる -->
            <input type="checkbox" name="botcheck" tabindex="-1" aria-hidden="true" style="display:none"/>

            <div class="cf-fields">

            <div class="cf-field cf-half">
                <label for="cf-name"><b>お名前</b><span class="cf-req">REQUIRED</span></label>
                <input id="cf-name" name="name" type="text" autocomplete="name" required/>
            </div>

            <div class="cf-field">
                <label for="cf-mail"><b>メールアドレス</b><span class="cf-req">REQUIRED</span></label>
                <input id="cf-mail" name="email" type="email" autocomplete="email" required/>
            </div>

            <div class="cf-field">
                <label for="cf-tel"><b>電話番号</b><span class="cf-req">REQUIRED</span></label>
                <input id="cf-tel" name="tel" type="tel" autocomplete="tel" required/>
            </div>

            <div class="cf-field">
                <label for="cf-company"><b>会社名</b><span class="cf-any">OPTIONAL</span></label>
                <input id="cf-company" name="company" type="text" autocomplete="organization"/>
            </div>

            <div class="cf-field">
                <label for="cf-role"><b>役職</b><span class="cf-any">OPTIONAL</span></label>
                <select id="cf-role" name="role">
                    <option value="">選んでください</option>
                    <option>経営者・役員</option>
                    <option>部長・課長／マネージャー</option>
                    <option>一般社員／スタッフ</option>
                </select>
            </div>

            <div class="cf-field cf-wide">
                <label for="cf-kind"><b>ご相談の種類</b><span class="cf-any">OPTIONAL</span></label>
                <select id="cf-kind" name="kind">
                    <option value="">選んでください</option>
                    <option>新しく採用サイトをつくりたい</option>
                    <option>いまの採用サイトをつくり直したい</option>
                    <option>採用のことから相談したい</option>
                    <option>まだ決まっていない</option>
                </select>
            </div>

            <div class="cf-field cf-wide">
                <label for="cf-body"><b>ご相談の内容</b><span class="cf-any">OPTIONAL</span></label>
                <textarea id="cf-body" name="message" placeholder="いま困っていること、採用で伝えたいこと、決まっていないことなど。箇条書きでかまいません。"></textarea>
            </div>

            </div><!-- /.cf-fields -->

            <button class="cf-send" type="submit" disabled>送信する<b aria-hidden="true">→</b></button>

            <p class="cf-result" role="status" hidden></p>
        </form>

        <footer class="cf-foot">
            <small>© 2026 Tilto° All Rights Reserved.</small>
            <nav>
                <small><a href="https://savorflow.co.jp/privacy" target="_blank" rel="noopener">Privacy Policy</a></small>
                <small><a href="https://savorflow.co.jp/" target="_blank" rel="noopener">株式会社Savor Flow</a></small>
            </nav>
        </footer>
    </main>

</div>

<script>
/* 送信の制御。
   ・アクセスキーが未設定のあいだはボタンを押せないままにする（届かない送信を起こさない）
   ・キーが入っていればボタンを有効にし、fetchで送ってこのページのまま結果を出す
     （素のPOSTだと web3forms の画面へ飛ばされてサイトの世界観から外れる）
   ・JSが動かない環境では素のPOSTにそのまま任せる（届きはする） */
(function () {
    var form = document.querySelector('.cf-form');
    if (!form) return;
    var key = form.querySelector('[name="access_key"]');
    var btn = form.querySelector('.cf-send');
    var pending = form.querySelector('.cf-pending');
    var result = form.querySelector('.cf-result');
    var ready = key && key.value && key.value !== 'PASTE_ACCESS_KEY_HERE';
    var thanks = new URL('./thanks.html', location.href).href;

    /* ── アクセスキーがまだ無いとき ──────────────────────────────
       🔴 押せるようにはする（社長が送信完了ページまで見られるように）。
          ただし**送信はしない**し、届いたと誤解させない:
            ・注記に「送信はされません」と出したまま
            ・完了ページへは ?preview=1 を付けて飛ばし、向こうでも同じ注記を出す
          ⚠️ ここを「素通りで完了ページへ」にしてはいけない。
             押せるのに届かないフォームは、届いたと思わせるので最も悪い。
       ⚠️ 必須の3つは素のブラウザ検証にそのまま任せる（submit は通ったときだけ起きる） */
    if (!ready) {
        btn.disabled = false;
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            location.href = thanks + '?preview=1';
        });
        return;
    }

    btn.disabled = false;
    if (pending) pending.remove();

    /* 素のPOST用に置いてある redirect を、いま開いている場所を基準に組み直す。
       公開先が変わっても、書き換え忘れで別サイトへ飛ばさないようにするため */
    var back = form.querySelector('[name="redirect"]');
    if (back) back.value = thanks;

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        btn.disabled = true;
        var label = btn.firstChild;
        var was = label.nodeValue;
        label.nodeValue = '送信中';
        result.hidden = true;

        fetch(form.action, {
            method: 'POST',
            headers: { Accept: 'application/json' },
            body: new FormData(form)
        }).then(function (r) { return r.json(); })
          .then(function (d) {
              if (d && d.success) {
                  /* 成功したら送信完了ページへ。
                     🔴 replace で行く（push しない）。戻るボタンで記入済みのフォームに
                        帰ってきて、二重に送ってしまうのを防ぐ */
                  form.reset();
                  location.replace(thanks);
                  return;
              }
              throw new Error('ng');
          })
          .catch(function () {
              result.textContent = 'うまく送信できませんでした。お手数ですが、時間をおいてもう一度お試しください。';
              result.className = 'cf-result is-ng';
          })
          .then(function () {
              result.hidden = false;
              label.nodeValue = was;
              btn.disabled = false;
          });
    });
})();
</script>
</body>
</html>
