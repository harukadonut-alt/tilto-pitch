<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>FV見出しの書体比較｜Tilto°</title>
<link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png?v=1"/>
<style>
  :root { --paper:#f7f4ee; --sumi:#111317; --coral:#ff4d4f; --chrome:96px }
  * { box-sizing: border-box }
  /* 1画面に収める。積まないので、案を切り替えても目の位置が動かない */
  html, body { height:100% }
  body { margin:0; display:flex; flex-direction:column; overflow:hidden;
         background:var(--paper); color:var(--sumi);
         font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }

  .bar { flex:none; display:flex; gap:6px; flex-wrap:wrap; align-items:center;
         padding:10px 5vw; border-bottom:1px solid #11131714 }
  .bar button { font:700 12px/1 Arial,"Hiragino Kaku Gothic ProN",sans-serif;
                letter-spacing:.06em; color:var(--sumi); background:#0000;
                border:1px solid #11131733; border-radius:2px; padding:8px 12px;
                cursor:pointer; transition:background .18s ease, color .18s ease, border-color .18s ease }
  .bar button:hover { background:var(--coral); border-color:var(--coral); color:#fff }
  .bar button[aria-pressed="true"] { background:var(--sumi); border-color:var(--sumi); color:#fff }
  /* 帯の動きは案の選択と役割が違うので、右端に離す */
  .bar #motion { margin-left:auto }
  .bar #motion[aria-pressed="false"] { background:var(--sumi); border-color:var(--sumi); color:#fff }
  .bar #motion[aria-pressed="true"] { background:#0000; border-color:#11131733; color:var(--sumi) }

  .tag { flex:none; display:flex; align-items:baseline; gap:14px; margin:0; padding:14px 5vw }
  .tag i { font-style:normal; font:700 11px/1 Arial,sans-serif; letter-spacing:.16em;
           color:var(--coral); border:1px solid var(--coral); padding:6px 9px; border-radius:2px }
  .tag b { font-size:14px; letter-spacing:.03em }
  .tag small { font-size:12px; color:#111317a0; letter-spacing:.02em }

  /* ── 本番のFVを**そのまま**入れる ─────────────────────────────────
     🔴 帯は WebGL で描いている。CSSで似せた静止版も試したが、本番は
        「細かいコマが曲がって二段」なのに対し、写真5枚が平らに並ぶ別物になった。
        なので本物のページを iframe で入れて、**見出しの指定だけ差し替える**。
     ⚠️ 比は 1674:943（本番の .hero-canvas の比）。この比にすると FV が
        ちょうど枠いっぱいに収まり、下の料金帯から先は見えない。
     ⚠️ 枠は**1つだけ**。案は枠の中のstyleを書き換えて切り替えるので、
        読み込み直しがなく、帯が巻き戻らない（WebGLの文脈の上限も気にしなくてよい）。 */
  .frame { flex:1; min-height:0; display:flex; align-items:flex-start; justify-content:center;
           padding:0 5vw 16px }
  .stage { position:relative; aspect-ratio:1674/943; overflow:hidden;
           width:min(100%, calc((100dvh - var(--chrome)) * 1674 / 943));
           background:linear-gradient(115deg,#fff 0%,#fbfcfd 47%,#f2f4f7 100%) }
  .stage iframe { display:block; width:100%; height:100%; border:0; pointer-events:none }
  .stage[data-on="0"]::after { content:'読み込み中…'; position:absolute; inset:0;
           display:flex; align-items:center; justify-content:center;
           font-size:12px; letter-spacing:.06em; color:#11131759 }
</style>
</head>
<body>

<nav class="bar" aria-label="案の切り替え">
  <button type="button" data-name="いまのサイト"        data-spec="游明朝 ・ w600 ・ 字間 -.085em"                data-css="">0 現状</button>
  <button type="button" data-name="縦に潰すのをやめる"  data-spec="scale 1×.8475 → 等倍 ・ 行間 1.24 → 1.15"      data-css="scale:1 1;line-height:1.15;margin-bottom:0">1 潰しなし</button>
  <button type="button" data-name="字間をひらく"        data-spec="-.085em → -.035em"                             data-css="letter-spacing:-.035em">2 ひらく</button>
  <button type="button" data-name="ウェイトを上げる"    data-spec="w600 → w700"                                   data-css="font-weight:700">3 太く</button>
  <button type="button" data-name="ウェイトを落とす"    data-spec="w600 → w400"                                   data-css="font-weight:400">4 細く</button>
  <button type="button" data-name="ヒラギノ明朝を先に"  data-spec="書体だけ変更 ・ w600"                          data-css="font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif">5 ヒラギノ</button>
  <button type="button" data-name="Noto Serif JP を先に" data-spec="書体だけ変更 ・ w500"                          data-css="font-family:'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif;font-weight:500">6 Noto</button>
  <button type="button" id="motion" aria-pressed="false">帯を止める</button>
</nav>

<p class="tag"><i id="tag-n">0</i><b id="tag-name">いまのサイト</b><small id="tag-spec">游明朝 ・ w600 ・ 字間 -.085em</small></p>

<div class="frame">
  <div class="stage" id="stage" data-on="0">
    <iframe id="fv" src="./index.html?intro=0" scrolling="no" tabindex="-1" aria-hidden="true" title="FVの見え方"></iframe>
  </div>
</div>

<script>
(function () {
    'use strict';

    var frame  = document.getElementById('fv');
    var stage  = document.getElementById('stage');
    var opts   = [].slice.call(document.querySelectorAll('.bar button[data-css]'));
    var motion = document.getElementById('motion');
    var current = 0;

    /* 🔴 既定は**動かしたまま**（本番と同じ）。
       この比較の判断軸が「右の帯に乗っている大きな文字に目を持っていかれないか」
       なので、止めた画で見比べると帯の文字が弱く見えて判断を誤る。
       字面そのものを見たいときだけ止める。 */
    var running = true;
    var gen = 0;   /* 状態を変えるたびに増やす。古い見張りに降りてもらうため */

    /* 枠の中の帯を、いまの running に合わせ続ける。
       🔴 1回押して終わりにできない。SSRのHTMLにボタンが**先に**あるので
          早すぎる click は押せてしまうが、そのあと React が hydrate して
          自分の初期状態（動いている）で上書きしてしまう。
          → **状態を毎回読み直して、食い違っていたら押す**。合っていれば触らないので、
            成功したあとに押し戻すことはない。 */
    function keepMotion() {
        var my = gen, tries = 0;
        (function step() {
            if (my !== gen) return;
            var doc;
            try { doc = frame.contentDocument } catch (e) { return }
            var b = doc && doc.querySelector('.ribbon-toggle');
            /* aria-pressed="true" ＝ 止まっている */
            if (b && (b.getAttribute('aria-pressed') === 'true') === running) b.click();
            if (++tries < 30) setTimeout(step, 400);
        })();
    }

    /* 案の切り替え。枠は読み込み直さず、中のstyleを書き換えるだけ。
       ⚠️ !important を付ける。本番の #top h1 と詳細度が同じで、
          読み込み順に左右されるのを避けるため */
    function paint() {
        var doc;
        try { doc = frame.contentDocument } catch (e) { return }
        if (!doc || !doc.head) return;
        var st = doc.getElementById('fv-typo');
        if (!st) {
            st = doc.createElement('style');
            st.id = 'fv-typo';
            doc.head.appendChild(st);
        }
        var css = opts[current].dataset.css;
        st.textContent = css ? '#top h1{' + css.split(';').filter(Boolean)
            .map(function (d) { return d + ' !important' }).join(';') + '}' : '';
    }

    function select(i) {
        current = i;
        opts.forEach(function (b, n) { b.setAttribute('aria-pressed', n === i ? 'true' : 'false') });
        document.getElementById('tag-n').textContent = String(i);
        document.getElementById('tag-name').textContent = opts[i].dataset.name;
        document.getElementById('tag-spec').textContent = opts[i].dataset.spec;
        paint();
    }

    opts.forEach(function (b, i) { b.addEventListener('click', function () { select(i) }) });

    motion.addEventListener('click', function () {
        running = !running;
        gen++;
        motion.textContent = running ? '帯を止める' : '帯を動かす';
        motion.setAttribute('aria-pressed', running ? 'false' : 'true');
        keepMotion();
    });

    /* 案の行き来は矢印キーと数字キーでもできる。見比べは連打になるので */
    document.addEventListener('keydown', function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { select((current + 1) % opts.length); e.preventDefault() }
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { select((current - 1 + opts.length) % opts.length); e.preventDefault() }
        else if (/^[0-9]$/.test(e.key) && +e.key < opts.length) select(+e.key);
    });

    frame.addEventListener('load', function () {
        stage.setAttribute('data-on', '1');
        try { frame.contentDocument.documentElement.style.overflow = 'hidden' } catch (e) {}
        paint();
        keepMotion();
    });

    /* 枠の高さは「画面の高さ − 上の帯とラベル」から出す。実測して入れる */
    function chrome() {
        var h = document.querySelector('.bar').offsetHeight
              + document.querySelector('.tag').offsetHeight + 16;
        document.documentElement.style.setProperty('--chrome', h + 'px');
    }
    window.addEventListener('resize', chrome);
    chrome();

    select(0);
})();
</script>
</body>
</html>
